<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Shell-Case – Phone Send Test</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js"></script>
<style>
  :root {
    --flamingo: #F05325;
    --eerie: #292524;
    --spring: #F1EEE5;
    --green: #4CAF50;
    --red: #E53935;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--eerie);
    color: #fff;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
  }

  .header {
    padding: 14px 16px;
    padding-top: calc(14px + env(safe-area-inset-top, 0px));
    background: var(--eerie);
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .header h1 { font-size: 16px; font-weight: 600; }
  .conn-dot {
    width: 10px; height: 10px;
    border-radius: 50%;
    margin-left: auto;
  }
  .conn-dot.off { background: var(--red); }
  .conn-dot.on { background: var(--green); }

  /* Simulated part cards (for testing) */
  .parts-area {
    flex: 1;
    padding: 16px;
    overflow-y: auto;
  }
  .parts-area h2 { font-size: 15px; margin-bottom: 12px; color: #ccc; }
  .test-part {
    background: rgba(255,255,255,0.08);
    border-radius: 10px;
    padding: 14px;
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .test-part .thumb {
    width: 56px; height: 56px;
    border-radius: 8px;
    background: rgba(255,255,255,0.12);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    overflow: hidden;
  }
  .test-part .thumb img { width: 100%; height: 100%; object-fit: cover; }
  .test-part .name { font-size: 14px; font-weight: 500; }
  .test-part .size { font-size: 12px; color: #999; }
  .test-part .check {
    margin-left: auto;
    width: 24px; height: 24px;
    border-radius: 6px;
    border: 2px solid #666;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    color: transparent;
  }
  .test-part .check.on { border-color: var(--flamingo); background: var(--flamingo); color: #fff; }

  /* Take photo area */
  .take-photo-area {
    padding: 12px 16px;
    border-top: 1px solid rgba(255,255,255,0.1);
  }
  .take-photo-btn {
    width: 100%;
    padding: 14px;
    border-radius: 10px;
    border: 2px dashed rgba(255,255,255,0.2);
    background: none;
    color: #ccc;
    font-size: 14px;
    cursor: pointer;
  }
  .take-photo-btn:active { border-color: var(--flamingo); }

  /* Bottom bar */
  .bottom-bar {
    padding: 14px 16px;
    padding-bottom: calc(14px + env(safe-area-inset-bottom, 0px));
    background: var(--eerie);
    border-top: 1px solid rgba(255,255,255,0.1);
  }
  .send-btn {
    width: 100%;
    padding: 16px;
    border-radius: 12px;
    border: none;
    background: var(--flamingo);
    color: #fff;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
  }
  .send-btn:disabled { opacity: 0.4; cursor: default; }
  .send-btn:active:not(:disabled) { background: #d4441a; }

  /* QR Scanner overlay */
  .scanner-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: #000;
    z-index: 100;
    flex-direction: column;
  }
  .scanner-overlay.show { display: flex; }
  .scanner-header {
    padding: 14px 16px;
    padding-top: calc(14px + env(safe-area-inset-top, 0px));
    display: flex;
    align-items: center;
    gap: 10px;
    z-index: 2;
  }
  .scanner-header h2 { font-size: 16px; color: #fff; }
  .scanner-close {
    margin-left: auto;
    background: rgba(255,255,255,0.15);
    border: none;
    color: #fff;
    width: 36px; height: 36px;
    border-radius: 50%;
    font-size: 18px;
    cursor: pointer;
  }
  .scanner-video-wrap {
    flex: 1;
    position: relative;
    overflow: hidden;
  }
  #scanner-video {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .scanner-frame {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 220px; height: 220px;
    border: 3px solid var(--flamingo);
    border-radius: 16px;
    box-shadow: 0 0 0 2000px rgba(0,0,0,0.5);
  }
  .scanner-hint {
    position: absolute;
    bottom: 80px;
    left: 0; right: 0;
    text-align: center;
    color: #fff;
    font-size: 14px;
  }
  .scanner-status {
    text-align: center;
    padding: 16px;
    padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px));
    font-size: 14px;
    color: #aaa;
  }

  /* Send dialog */
  .dialog-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    z-index: 50;
    align-items: flex-end;
    justify-content: center;
  }
  .dialog-overlay.show { display: flex; }
  .dialog {
    background: #fff;
    color: var(--eerie);
    border-radius: 20px 20px 0 0;
    width: 100%;
    max-width: 420px;
    padding: 28px 24px;
    padding-bottom: calc(24px + env(safe-area-inset-bottom, 0px));
  }
  .dialog h2 { font-size: 20px; margin-bottom: 4px; }
  .dialog .count-msg { font-size: 14px; color: #666; margin-bottom: 18px; }
  .dialog-btn {
    display: block;
    width: 100%;
    padding: 16px;
    border-radius: 12px;
    border: 2px solid #eee;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    text-align: center;
    margin-bottom: 10px;
  }
  .dialog-btn.primary { background: var(--flamingo); color: #fff; border-color: var(--flamingo); }
  .dialog-btn.secondary { background: #fff; color: var(--eerie); }

  /* Toast */
  .toast {
    position: fixed;
    top: 60px;
    left: 50%; transform: translateX(-50%);
    background: var(--green);
    color: #fff;
    padding: 10px 20px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 500;
    z-index: 200;
    display: none;
  }
  .toast.show { display: block; }
</style>
</head>
<body>

<div class="header">
  <h1>📱 Phone – Send Test</h1>
  <div id="conn-dot" class="conn-dot off" title="Not connected"></div>
</div>

<!-- Test parts list -->
<div class="parts-area">
  <h2>Your parts (test data)</h2>
  <div class="test-part" data-id="1">
    <div class="thumb">📦</div>
    <div><div class="name">Test Box Part</div><div class="size">120 × 80 × 45 mm</div></div>
    <div class="check on" onclick="toggleCheck(this)">✓</div>
  </div>
  <div id="photo-parts"></div>

  <div class="take-photo-area">
    <button class="take-photo-btn" onclick="takeTestPhoto()">📷 Take a photo (test)</button>
    <input type="file" id="file-input" accept="image/*" capture="environment" style="display:none" onchange="onPhotoTaken(event)">
  </div>
</div>

<!-- Send button -->
<div class="bottom-bar">
  <button class="send-btn" onclick="openSendDialog()">Send to computer</button>
</div>

<!-- Send dialog -->
<div id="send-dialog" class="dialog-overlay">
  <div class="dialog">
    <h2>Send to the computer</h2>
    <p class="count-msg" id="dialog-count">1 object ready.</p>
    <button class="dialog-btn primary" onclick="openScanner()">📱 Scan QR code on the computer</button>
    <button class="dialog-btn secondary" onclick="copyDesktopLink()">📋 Copy the link to computer app</button>
    <button class="dialog-btn secondary" onclick="closeSendDialog()">Close</button>
  </div>
</div>

<!-- QR Scanner -->
<div id="scanner" class="scanner-overlay">
  <div class="scanner-header">
    <h2>Scan QR on the computer</h2>
    <button class="scanner-close" onclick="closeScanner()">✕</button>
  </div>
  <div class="scanner-video-wrap">
    <video id="scanner-video" autoplay playsinline></video>
    <div class="scanner-frame"></div>
    <div class="scanner-hint">Point at the QR code on the computer screen</div>
  </div>
  <div id="scanner-status" class="scanner-status">Starting camera…</div>
</div>

<!-- Toast -->
<div id="toast" class="toast"></div>

<script>
// ─── State ───
let peerConn = null;
let myPeer = null;
let scannerStream = null;
let scanInterval = null;
let photosToSend = [];
let testPartSelected = true;

// ─── Take a test photo ───
function takeTestPhoto() {
  document.getElementById('file-input').click();
}

function onPhotoTaken(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    const dataUrl = ev.target.result;
    photosToSend.push(dataUrl);
    // Add card
    const wrap = document.getElementById('photo-parts');
    const div = document.createElement('div');
    div.className = 'test-part';
    div.innerHTML = `
      <div class="thumb"><img src="${dataUrl}"></div>
      <div><div class="name">Photo ${photosToSend.length}</div><div class="size">From camera</div></div>
      <div class="check on">✓</div>`;
    wrap.appendChild(div);
  };
  reader.readAsDataURL(file);
  e.target.value = '';
}

function toggleCheck(el) {
  el.classList.toggle('on');
  el.textContent = el.classList.contains('on') ? '✓' : '';
  testPartSelected = el.classList.contains('on');
}

// ─── Send dialog ───
function openSendDialog() {
  const total = photosToSend.length + (testPartSelected ? 1 : 0);
  document.getElementById('dialog-count').textContent = total + ' object' + (total !== 1 ? 's' : '') + ' ready.';
  document.getElementById('send-dialog').classList.add('show');
}
function closeSendDialog() {
  document.getElementById('send-dialog').classList.remove('show');
}

function copyDesktopLink() {
  const url = window.location.href.replace('phone-peer-test.html', 'desktop-peer-test.html');
  navigator.clipboard.writeText(url).then(() => {
    showToast('Link copied — open it on your computer');
  }).catch(() => {
    prompt('Open this on your computer:', url);
  });
}

// ─── QR Scanner ───
function openScanner() {
  closeSendDialog();
  document.getElementById('scanner').classList.add('show');
  startScanning();
}
function closeScanner() {
  stopScanning();
  document.getElementById('scanner').classList.remove('show');
}

async function startScanning() {
  const video = document.getElementById('scanner-video');
  const statusEl = document.getElementById('scanner-status');
  try {
    scannerStream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } },
      audio: false
    });
    video.srcObject = scannerStream;
    statusEl.textContent = 'Looking for QR code…';

    // Use BarcodeDetector API (Chrome, Safari, Edge on mobile)
    if ('BarcodeDetector' in window) {
      const detector = new BarcodeDetector({ formats: ['qr_code'] });
      scanInterval = setInterval(async () => {
        try {
          const codes = await detector.detect(video);
          if (codes.length > 0) {
            const url = codes[0].rawValue;
            if (url && url.includes('?s=')) {
              stopScanning();
              handleQRResult(url);
            }
          }
        } catch (e) { /* frame not ready */ }
      }, 300);
    } else {
      // Fallback: ask user to type session ID
      statusEl.innerHTML = 'Your browser does not support QR scanning.<br>Copy the session ID from the computer and paste it here:<br><input id="manual-session" style="margin-top:8px;padding:8px;border-radius:6px;border:1px solid #666;background:#222;color:#fff;font-size:16px;width:80%" placeholder="sc-xxxxxxxx"><br><button onclick="manualConnect()" style="margin-top:8px;padding:10px 24px;border-radius:8px;border:none;background:#F05325;color:#fff;font-size:14px;font-weight:600;cursor:pointer">Connect</button>';
    }
  } catch (err) {
    statusEl.textContent = 'Camera access denied. Allow camera to scan QR codes.';
  }
}

function stopScanning() {
  if (scanInterval) { clearInterval(scanInterval); scanInterval = null; }
  if (scannerStream) { scannerStream.getTracks().forEach(t => t.stop()); scannerStream = null; }
}

function manualConnect() {
  const id = document.getElementById('manual-session').value.trim();
  if (id) {
    closeScanner();
    connectAndSend(id);
  }
}

function handleQRResult(url) {
  closeScanner();
  // Extract session ID from URL
  try {
    const u = new URL(url);
    const sid = u.searchParams.get('s');
    if (sid) {
      showToast('QR scanned! Connecting…');
      connectAndSend(sid);
    }
  } catch (e) {
    showToast('Invalid QR code');
  }
}

// ─── PeerJS — phone is the SENDER ───
function connectAndSend(sessionId) {
  const dot = document.getElementById('conn-dot');
  dot.className = 'conn-dot off';

  myPeer = new Peer(); // random ID
  myPeer.on('open', () => {
    peerConn = myPeer.connect(sessionId, { reliable: true });

    peerConn.on('open', () => {
      dot.className = 'conn-dot on';
      showToast('Connected! Sending…');

      // Send all photos
      let sent = 0;
      photosToSend.forEach(dataUrl => {
        peerConn.send({ type: 'photo', dataUrl });
        sent++;
      });

      // Send test box as a placeholder image (a simple canvas-drawn box)
      if (testPartSelected) {
        const c = document.createElement('canvas');
        c.width = 400; c.height = 300;
        const ctx = c.getContext('2d');
        ctx.fillStyle = '#f5f0e8';
        ctx.fillRect(0, 0, 400, 300);
        ctx.strokeStyle = '#292524';
        ctx.lineWidth = 2;
        ctx.strokeRect(60, 60, 280, 180);
        ctx.fillStyle = '#292524';
        ctx.font = '16px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('Test Box: 120 × 80 × 45 mm', 200, 155);
        peerConn.send({ type: 'photo', dataUrl: c.toDataURL('image/png') });
        sent++;
      }

      showToast('✅ ' + sent + ' part' + (sent !== 1 ? 's' : '') + ' sent!');

      setTimeout(() => {
        if (peerConn) peerConn.close();
        dot.className = 'conn-dot off';
      }, 3000);
    });

    peerConn.on('error', (err) => {
      showToast('Connection failed: ' + err);
    });
  });

  myPeer.on('error', (err) => {
    showToast('Could not connect. Is the computer page open?');
  });
}

// ─── Toast ───
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3500);
}
</script>
</body>
</html>
